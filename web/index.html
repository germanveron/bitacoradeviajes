<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bitácora de viajes</title>
<meta name="theme-color" content="#07121c">
<meta name="color-scheme" content="light">
<meta name="description" content="Tu bitácora de viajes: mapa, lugares, fotos y eventos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css?v=18">
</head>
<body>
<div id="auth" hidden></div>

<div id="shell" hidden>
  <div id="scroller">
    <div id="top">
      <div class="topbar">
        <button class="hdrwho" id="avatarBtn" aria-label="Mi cuenta y perfiles">
          <span class="avatar" id="avatarDot"></span>
          <span class="who-tx"><b id="hello"></b><span id="profType"></span></span>
        </button>
        <div class="brand"><img src="icon.svg" alt="" width="34" height="34"><h1>Bitácora<br>de viajes</h1></div>
      </div>
      <div id="topSlot"></div>
    </div>
    <main id="main"></main>
  </div>
  <div class="tabdock">
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Secciones">
      <button role="tab" data-tab="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span>Inicio</span></button>
      <button role="tab" data-tab="viajes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c4-1 3-6 7-6s3 5 9-8"/><circle cx="4" cy="18" r="1.6"/><circle cx="20" cy="4" r="1.6"/></svg><span>Países</span></button>
      <button class="plus" id="plusBtn" aria-label="Agregar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button role="tab" data-tab="eventos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 5.6 6 .7-4.5 4.1 1.3 6L12 16.4 6.7 19.4l1.3-6L3.5 9.3l6-.7z"/></svg><span>Eventos</span></button>
      <button role="tab" data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></button>
    </nav>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet"></div></div>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
<input type="file" id="avatarInput" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module" src="js/app.js?v=18"></script>
</body>
</html>
